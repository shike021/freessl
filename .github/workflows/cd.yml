name: CD - Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  COMPOSE_FILE: docker-compose.deploy.yml

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to production
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.DEPLOY_DIR }}

            TIMESTAMP=\$(date +"%Y%m%d%H%M%S")
            mkdir -p backups/\$TIMESTAMP

            # Backup current state
            echo "[backup] Stopping services and backing up..."
            docker compose -f ${COMPOSE_FILE} down > backups/\$TIMESTAMP/down.log 2>&1 || true

            # Ensure .env exists
            if [ ! -f .env ]; then
              echo "[error] .env not found. Please create it from .env.prod template."
              exit 1
            fi

            # Pull pre-built images
            echo "[pull] Downloading images from GHCR..."
            docker compose -f ${COMPOSE_FILE} --env-file .env pull \
              || echo "[warn] Pull failed, images may not exist for tag \${IMAGE_TAG}"

            # Generate nginx.conf from template if present
            if [ -f nginx/nginx.conf.template ] && [ -f .env ]; then
              echo "[nginx] Generating nginx.conf from template..."
              DOMAIN=\$(grep '^DOMAIN=' .env | cut -d'=' -f2)
              if [ -n "\$DOMAIN" ]; then
                sed "s/\\\${DOMAIN}/\$DOMAIN/g" nginx/nginx.conf.template > nginx/nginx.conf
              fi
            fi

            # Start services with new images
            echo "[deploy] Starting services..."
            docker compose -f ${COMPOSE_FILE} --env-file .env up -d

            # Clean up old images
            docker image prune -f

            # Show status
            docker compose -f ${COMPOSE_FILE} ps
          ENDSSH

      - name: Health check
        run: |
          echo "Waiting 30s for services to start..."
          sleep 30

          HEALTHY=true
          curl -sf https://${{ secrets.DEPLOY_DOMAIN }}/health || HEALTHY=false

          if [ "\$HEALTHY" = "true" ]; then
            echo "Health check passed!"
          else
            echo "Health check failed, rolling back..."
            ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
              cd ${{ secrets.DEPLOY_DIR }}
              LATEST_BACKUP=\$(ls -1 backups/ | sort -r | head -1)
              if [ -n "\$LATEST_BACKUP" ]; then
                docker compose -f ${COMPOSE_FILE} down
                docker compose -f ${COMPOSE_FILE} --env-file .env up -d
                echo "Rolled back to previous deployment."
              fi
            ENDSSH
            exit 1
          fi
